# Builds the corkscrew CLI and its AWS and Cloudflare provider plugins,
# packaged the way CloudBridge installs and runs them, and publishes them
# as a release.
#
# Upstream's release archives ship the plugin sources but no built plugin,
# so a scanner cannot run from them as downloaded. This workflow builds
# them on native runners (the CLI links DuckDB through cgo) and lays them
# out as corkscrew resolves a local plugin root relative to its working
# directory:
#
#   corkscrew[.exe]
#   build/bin/plugins/official/aws/aws-provider[.exe]
#   build/bin/plugins/official/aws/plugin.json
#   build/bin/plugins/official/cloudflare/cloudflare-provider[.exe]
#   build/bin/plugins/official/cloudflare/plugin.json
#
# Push a tag named cloudbridge-r<N> to publish.
name: CloudBridge distribution

on:
  push:
    tags:
      - 'cloudbridge-r*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            archive: corkscrew-cloudbridge_darwin_arm64.tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-latest
            archive: corkscrew-cloudbridge_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI and provider plugins
        shell: bash
        env:
          CGO_ENABLED: '1'
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          ext=""
          if [ "$TARGET_OS" = windows ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
            -o "package/corkscrew${ext}" ./cmd/corkscrew
          # build_plugin <provider> [go build flags...]
          build_plugin() {
            local provider="$1"; shift
            local binary="${provider}-provider"
            local plugin_dir="package/build/bin/plugins/official/${provider}"
            mkdir -p "$plugin_dir"
            (cd "plugins/${binary}" && go build -trimpath "$@" -ldflags "-s -w" \
              -o "../../${plugin_dir}/${binary}${ext}" .)
            # The manifest names the file exactly; on Windows that is the .exe.
            sed "s/\"executable\": \"${binary}\"/\"executable\": \"${binary}${ext}\"/" \
              "plugins/${binary}/plugin.json" > "${plugin_dir}/plugin.json"
            grep -q "\"executable\": \"${binary}${ext}\"" "${plugin_dir}/plugin.json"
          }
          build_plugin aws -tags=aws_services
          build_plugin cloudflare
          cp LICENSE package/LICENSE

      - name: Smoke-test the package
        shell: bash
        run: |
          cd package
          ext=""; if [ "${{ matrix.goos }}" = windows ]; then ext=".exe"; fi
          "./corkscrew${ext}" --help > /dev/null
          # The plugins must be found where CloudBridge will run them from.
          for provider in aws cloudflare; do
            "./corkscrew${ext}" plugin status "$provider" | tee status.txt
            grep -q 'installed=true' status.txt
          done
          rm status.txt
          "./build/bin/plugins/official/cloudflare/cloudflare-provider${ext}" -test

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: tar -C package -czf "${{ matrix.archive }}" .

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "corkscrew CLI with the AWS and Cloudflare provider plugins, built from ${GITHUB_SHA} for CloudBridge's Insights page. Includes the fixes proposed in jlgore/corkscrew#22 and the scan service-group fix that lets Cloudflare scan its storage service."
